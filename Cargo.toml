[package]
name = "UniPinoNft"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[features]
bpf-entrypoint = []


[dependencies]
# pinocchio toolset
pinocchio = { version = "0.10.2", features = ["cpi"] }
pinocchio-system = "0.5.0"
pinocchio-pubkey = "0.3.0"
pinocchio-token-2022 = "0.2.0"
pinocchio-log = "0.5.1"

bytemuck = { version = "1.24.0", features = ["derive", "min_const_generics"] }
solana-address = { version = "2.1.0", features = ["curve25519"] }

# IDL generator
#shank = { version = "0.4.6", default-features = false }


[dev-dependencies]
# test - Note: litesvm and solana-sdk have version compatibility issues
# Tests will need careful dependency alignment. For now, use cargo build-sbf for validation.
# litesvm = "0.8.2"
# solana-sdk = "2.2"
